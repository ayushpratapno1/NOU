
name: Neon PR Database Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Django with temporary Neon database
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set branch expiration
        id: expiration
        run: |
          echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse isolated Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_type: schema-only
          expires_at: ${{ steps.expiration.outputs.expires_at }}

      - name: Apply Django migrations
        run: python manage.py migrate --noinput
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          SECRET_KEY: ci-only-test-secret
          DEBUG: "True"
          PRODUCTION: "False"

      - name: Run Django tests
        run: python manage.py test
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          SECRET_KEY: ci-only-test-secret
          DEBUG: "True"
          PRODUCTION: "False"

  delete:
    name: Delete temporary Neon branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Delete temporary Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
