
name: Neon PR Database Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Django with temporary Neon database
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set branch expiration
        id: expiration
        run: |
          echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse isolated Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_type: schema-only
          expires_at: ${{ steps.expiration.outputs.expires_at }}

      - name: Apply Django migrations
        run: python manage.py migrate --noinput
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          SECRET_KEY: ci-only-test-secret
          DEBUG: "True"
          PRODUCTION: "False"

      - name: Run Django tests
        run: python manage.py test
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          SECRET_KEY: ci-only-test-secret
          DEBUG: "True"
          PRODUCTION: "False"

  
  delete:
    name: Delete temporary Neon branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl@v2

      - name: Find preview branch
        id: find_branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_API_HOST: https://console.neon.tech/api/v2
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PREVIEW_BRANCH: preview/pr-${{ github.event.number }}
        shell: bash
        run: |
          set -euo pipefail

          neonctl branches list \
            --project-id "$NEON_PROJECT_ID" \
            --output json > branches.json

          python - <<'PY'
          import json
          import os

          with open("branches.json", encoding="utf-8") as f:
              data = json.load(f)

          branches = data if isinstance(data, list) else data.get("branches", [])
          target = os.environ["PREVIEW_BRANCH"]

          found = any(
              isinstance(branch, dict) and branch.get("name") == target
              for branch in branches
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"found={'true' if found else 'false'}\n")

          print(f"{'Found' if found else 'Did not find'} {target}")
          PY

      - name: Delete preview branch
        if: steps.find_branch.outputs.found == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_API_HOST: https://console.neon.tech/api/v2
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PREVIEW_BRANCH: preview/pr-${{ github.event.number }}
        run: |
          neonctl branches delete "$PREVIEW_BRANCH" \
            --project-id "$NEON_PROJECT_ID" \
            --yes

      - name: Skip cleanup when branch is absent
        if: steps.find_branch.outputs.found != 'true'
        run: echo "No temporary preview branch exists; nothing to delete."
