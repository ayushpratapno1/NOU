
services:
  - type: web
    name: egyanproject
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn egyanproject.wsgi:application
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: PRODUCTION
        value: "True"

      - key: ALLOWED_HOSTS
        fromService:
          name: egyanproject
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

      - key: DJANGO_SUPERUSER_USERNAME
        sync: false

      - key: DJANGO_SUPERUSER_EMAIL
        sync: false

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false
